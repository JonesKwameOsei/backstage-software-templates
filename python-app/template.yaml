apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: python-app
  title: Python flask template
  description: Provisions a minimalistic flask application
spec:
  owner: development
  type: service

  parameters:
    - title: Fill in some steps
      required:
        - component_id
        - environment
      properties:
        component_id:
          title: Component name
          type: string
          description: Provide a component (microservice) name
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        environment:
          title: Environment
          type: string
          description: The environment where this component will be deployed
          enum:
            - dev
            - staging
            - uat
            - prod

  steps:
    - id: fetch-base
      name: Fetch Base
      action: fetch:template
      input:
        url: ./template
        values:
          app_name: ${{parameters.component_id}}
          app_env: ${{parameters.environment}}

    - id: publish
      name: Publish
      action: publish:github
      input:
        description: This is ${{ parameters.component_id }}
        repoUrl: github.com?owner=JonesKwameOsei&repo=${{parameters.component_id}}
        protectDefaultBranch: false
        repoVisibility: public
        defaultBranch: main

    - id: fetch-argocd-app
      name: Render Argo CD Application
      action: fetch:template
      input:
        url: ./gitops
        targetPath: ./gitops-pr
        values:
          app_name: ${{ parameters.component_id }}
          app_env: ${{ parameters.environment }}

    - id: register-argocd-app
      name: Open PR in GitOps repo
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=JonesKwameOsei&repo=gitops
        branchName: add-${{ parameters.component_id }}
        title: "Add ${{ parameters.component_id }} (${{ parameters.environment }})"
        description: Created by Backstage
        sourcePath: ./gitops-pr
        targetPath: apps


    - id: register
      name: Register
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: "/catalog-info.yaml"

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
