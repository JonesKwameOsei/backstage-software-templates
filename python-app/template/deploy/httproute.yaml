apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${{ values.app_name }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: web
      namespace: default
  hostnames:
    - ${{ values.app_name }}.test.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
      - name: ${{ values.app_name }}
        port: 8080
